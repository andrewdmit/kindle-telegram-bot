<style>
body{margin:0;padding:0 0 max(12px,env(safe-area-inset-bottom));--a:var(--tg-theme-button-color);--b:var(--tg-theme-accent-text-color);--ok:#2fb563}
.hd{position:relative;display:flex;align-items:center;gap:12px;padding:14px;color:#fff;background:linear-gradient(120deg,var(--a),var(--b),var(--a));background-size:220% 100%;animation:fl 8s ease-in-out infinite alternate}
@keyframes fl{to{background-position:100% 0}}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.22)}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:17px}
.ht small{color:rgba(255,255,255,.85)}
.rg{flex:none;width:44px;height:44px;position:relative}
.rg svg{transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:4}
.rg .bg{stroke:rgba(255,255,255,.25)}
.rg .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:113;transition:stroke-dashoffset .6s cubic-bezier(.3,1.4,.5,1)}
.rg span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.tl{padding:6px 14px 0}
.st{position:relative;display:flex;gap:12px;padding:8px 0}
.st:not(:last-child)::before{content:'';position:absolute;left:13px;top:38px;bottom:-6px;width:2px;border-radius:1px;background:var(--tg-theme-secondary-bg-color)}
.st.dn::before{background:var(--ok)}
.n{position:relative;flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-hint-color);transition:background .3s,transform .3s}
.on .n{background:var(--a);color:#fff}
.on .n::after{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:50%;border:2px solid var(--a);animation:pl 1.6s ease-out infinite}
@keyframes pl{to{transform:scale(1.7);border-color:transparent}}
.dn .n{background:var(--ok);color:#fff;transform:scale(.9)}
.b{flex:1;min-width:0;padding-top:4px}
.t{font-weight:600}
.dn .t{color:var(--tg-theme-hint-color)}
.cd{margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--tg-theme-secondary-bg-color)}
.an{animation:in .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{transform:translateY(10px) scale(.97)}}
.h{color:var(--tg-theme-hint-color);font-size:13px}
.v{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:8px;font:13px ui-monospace,monospace;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;background:var(--tg-theme-bg-color)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button{font-size:13px;padding:7px 12px;border-radius:10px;transition:transform .15s}
button:active{transform:scale(.95)}
.l{background:var(--tg-theme-bg-color);color:var(--tg-theme-link-color)}
.p{background:linear-gradient(120deg,var(--a),var(--b));color:#fff}
.er{color:var(--tg-theme-destructive-text-color);font-size:13px}
.ok{color:var(--ok);font-size:13px}
.fin{position:relative;margin:8px 14px 0;padding:12px;border-radius:14px;color:#fff;font-weight:600;background:linear-gradient(120deg,var(--ok),#1f9bd1);animation:in .5s cubic-bezier(.2,.9,.3,1.3) both}
.cf{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:2px;animation:bm 1.1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes bm{to{transform:translate(var(--x),var(--y)) rotate(400deg) scale(0)}}
.m{padding:6px 14px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="hd"><div class="ic">📚</div><div class="ht"><b>Регистрация</b><small id="sub"></small></div><div class="rg"><svg width="44" height="44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" id="fg" cx="22" cy="22" r="18" stroke-dashoffset="113"/></svg><span id="rn"></span></div></div>
<div class="tl" id="a"></div>
<div id="fin"></div>
<div class="h m" id="m"></div>
<script>
const W = window.TelegramWidget, $ = (i) => document.getElementById(i);
const AMZ = 'https://www.amazon.com/hz/mycd/digital-console/contentdevices/alldevices';
const ERR = {NOT_ALLOWED: 'Откройте чат с ботом', BUSY: 'Подождите…', RATE_LIMITED: 'Слишком часто, подождите', TIMEOUT: 'Бот не ответил', FAILED: 'Нет связи с ботом'};
let S = {}, busy = 0, last = 0, fresh = 0;
function tone() {
  const c = W && W.themeParams.button_color;
  if (!c) return;
  let [r, g, b] = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, e = mx - mn;
  if (e) { s = l > .5 ? e / (2 - mx - mn) : e / (mx + mn); h = 60 * (mx === r ? (g - b) / e + (g < b ? 6 : 0) : mx === g ? (b - r) / e + 2 : (r - g) / e + 4); }
  document.body.style.setProperty('--b', 'hsl(' + ((h + 40) % 360) + ',' + Math.round(s * 100) + '%,' + Math.round(l * 85) + '%)');
}
function load(t) { try { const n = JSON.parse(t); if (n && (S.r === undefined || n.r >= S.r)) S = n; } catch (e) {} }
function esc(s) { return String(s || '').replace(/[&<>"]/g, (c) => '&#' + c.charCodeAt(0) + ';'); }
function btn(txt, cls, fn) { const b = document.createElement('button'); b.textContent = txt; b.className = cls; b.onclick = fn; b.disabled = !!busy && fn.q; return b; }
function q(data) { const f = () => ask(data); f.q = 1; return f; }
function ask(data) {
  if (!W) return;
  busy = 1; $('m').textContent = 'Отправляю…'; draw();
  W.request(data).then((a) => { busy = 0; $('m').textContent = ''; load(a.result); draw(); },
    (e) => { busy = 0; $('m').textContent = ERR[e.code] || 'Ошибка: ' + e.code; draw(); });
}
function step(n, cls, title, card, btns) {
  const d = document.createElement('div');
  d.className = 'st ' + cls;
  d.innerHTML = '<div class="n">' + (cls === 'dn' ? '✓' : n) + '</div><div class="b"><div class="t">' + title + '</div>' + (card ? '<div class="' + (cls === 'on' ? 'cd' + (fresh ? ' an' : '') : '') + '">' + card + '</div>' : '') + '</div>';
  if (btns.length) { const r = document.createElement('div'); r.className = 'row'; r.append(...btns); d.querySelector('.b').lastChild.append(r); }
  return d;
}
function confetti(box) {
  const C = ['#ffd23f', '#ff5e7e', '#fff', '#7cf0b0', '#7cc7ff'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('i'), k = i / 14 * 6.28;
    p.className = 'cf';
    p.style.cssText = 'background:' + C[i % 5] + ';--x:' + Math.round(Math.cos(k) * (60 + i * 5)) + 'px;--y:' + Math.round(Math.sin(k) * 40 - 20) + 'px;animation-delay:' + (i % 4) * 40 + 'ms';
    box.append(p);
  }
}
function draw() {
  const s = S.s || 1, st = [];
  fresh = s !== last;
  st.push(s > 1 && S.e
    ? step(1, 'dn', 'Kindle email', '<span class="v">' + esc(S.e) + '</span>', [btn('Изменить', 'l', q('reg:edit'))])
    : step(1, 'on', 'Kindle email', '<div class="h">Отправьте адрес ответным сообщением, например <b>name@kindle.com</b></div>',
      [btn('Где его найти?', 'l', () => W && W.openLink(AMZ))]));
  st.push(step(2, s > 2 ? 'dn' : s === 2 ? 'on' : '', 'Разрешите отправителя',
    s === 2 ? '<div class="h">Amazon → Preferences → Personal Document Settings → Approved E-mail List</div><span class="v">' + esc(S.f) + '</span>' : '',
    s === 2 ? [btn('Скопировать', 'l', () => W && W.copyText(S.f)), btn('Amazon', 'l', () => W && W.openLink(AMZ)), btn('Я добавил ✓', 'p', q('reg:ok'))] : []));
  const t = S.t === 'run' ? '<div class="h">Отправляю тестовый документ…</div>'
    : S.t === 'ok' ? '<div class="ok">Тест отправлен — проверьте Kindle через пару минут</div>'
    : S.t === 'err' ? '<div class="er">' + esc(S.te || 'Не удалось отправить') + '</div>' : '<div class="h">Необязательно: пришлём документ-проверку</div>';
  st.push(step(3, S.t === 'ok' ? 'dn' : s === 3 ? 'on' : '', 'Проверка', s === 3 ? t : '',
    s === 3 && S.t !== 'run' ? [btn(S.t ? 'Ещё раз' : 'Отправить тест', 'l', q('reg:test'))] : []));
  $('a').replaceChildren(...st);
  const done = s === 3, f = $('fin');
  $('sub').textContent = done ? 'Всё готово ✨' : 'Шаг ' + s + ' из 3';
  $('rn').textContent = done ? '✓' : s + '/3';
  $('fg').setAttribute('stroke-dashoffset', String(Math.round(113 * (1 - (done ? 3 : s - 1) / 3))));
  if (done && !f.firstChild) {
    const c = document.createElement('div'); c.className = 'fin'; c.textContent = '🎉 Готово! Присылайте книги файлами в этот чат.'; f.append(c);
    if (last && last < 3) { confetti(c); W && W.HapticFeedback.notificationOccurred('success'); }
  } else if (!done) f.replaceChildren();
  last = s;
}
if (W) { load(W.chatData); tone(); W.onEvent('chatDataChanged', () => { load(W.chatData); draw(); }); W.onEvent('themeChanged', tone); }
draw();
if (W) W.ready();
</script>

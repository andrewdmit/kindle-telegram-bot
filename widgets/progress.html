<style>
body{margin:0;padding:0 0 max(12px,env(safe-area-inset-bottom));--a:var(--tg-theme-button-color);--b:var(--tg-theme-accent-text-color);--ok:#2fb563}
.hd{display:flex;align-items:center;gap:12px;padding:14px;color:#fff;background:linear-gradient(120deg,var(--a),var(--b),var(--a));background-size:220% 100%;animation:fl 8s ease-in-out infinite alternate}
@keyframes fl{to{background-position:100% 0}}
.dn .hd{background:linear-gradient(120deg,var(--ok),#1f9bd1);animation:none}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:17px}
.ht small{display:block;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg{flex:none;width:56px;height:56px;position:relative}
.rg svg{transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:5}
.rg .bg{stroke:rgba(255,255,255,.25)}
.rg .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:145;transition:stroke-dashoffset .8s cubic-bezier(.3,1.2,.5,1)}
.rg span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.br{height:4px;background:repeating-linear-gradient(-45deg,var(--a) 0 8px,var(--b) 8px 16px);background-size:23px 23px;animation:mv .8s linear infinite}
@keyframes mv{to{background-position:23px 0}}
.dn .br{background:var(--ok);animation:none}
.ls{padding:4px 14px 0}
.it{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--tg-theme-section-separator-color)}
.it:last-child{border:0}
.ic{position:relative;flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;background:var(--tg-theme-secondary-bg-color)}
.s0 .ic::after{content:'';width:6px;height:6px;border-radius:3px;background:var(--tg-theme-hint-color)}
.run .ic{background:conic-gradient(var(--a),var(--b),transparent 75%);animation:sp .9s linear infinite}
.run .ic::after{content:'';position:absolute;top:4px;left:4px;right:4px;bottom:4px;border-radius:50%;background:var(--tg-theme-bg-color)}
@keyframes sp{to{transform:rotate(360deg)}}
.s4 .ic{background:var(--ok)}
.ic path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20}
.nw path{animation:ck .5s ease-out both}
@keyframes ck{from{stroke-dashoffset:20}}
.s5 .ic{background:var(--tg-theme-destructive-text-color)}
.nw.s5 .ic{animation:sk .5s}
@keyframes sk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.b{flex:1;min-width:0}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.h{color:var(--tg-theme-hint-color);font-size:13px}
.er{color:var(--tg-theme-destructive-text-color);font-size:13px;overflow-wrap:anywhere}
.ph{display:flex;gap:4px;margin-top:5px}
.ph i{flex:1;height:4px;border-radius:2px;background:var(--tg-theme-secondary-bg-color)}
.ph .y{background:var(--a)}
.ph .c{background:linear-gradient(90deg,var(--a) 30%,var(--b) 50%,var(--a) 70%);background-size:300% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-50% 0}}
.end{position:relative;margin:8px 14px 0;padding:12px;border-radius:14px;font-size:14px;background:var(--tg-theme-secondary-bg-color);animation:in .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes in{from{transform:translateY(10px) scale(.96)}}
.cf{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:2px;animation:bm 1.1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes bm{to{transform:translate(var(--x),var(--y)) rotate(400deg) scale(0)}}
button{display:block;width:calc(100% - 28px);margin:10px 14px 0;padding:11px;border-radius:12px;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--a),var(--b));transition:transform .15s}
button:active{transform:scale(.97)}
#m{padding:6px 14px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="w"><div class="hd"><div class="ht"><b>🚀 Отправка на Kindle</b><small id="sub"></small></div><div class="rg"><svg width="56" height="56"><circle class="bg" cx="28" cy="28" r="23"/><circle class="fg" id="fg" cx="28" cy="28" r="23" stroke-dashoffset="145"/></svg><span id="pc">0%</span></div></div>
<div class="br"></div><div class="ls" id="list"></div><div id="end"></div><div class="h" id="m"></div></div>
<script>
const W = window.TelegramWidget, $ = (i) => document.getElementById(i);
const ERR = {RATE_LIMITED: 'Слишком часто, подождите', TIMEOUT: 'Бот не ответил'};
const PH = ['В очереди', 'Скачиваю из Telegram', 'Готовлю письмо', 'Отправляю на почту Amazon', 'Отправлено', 'Ошибка'];
let S = {f: []}, busy = 0, prev = null, shown = 0, fin0 = null, key = '';
function tone() {
  const c = W && W.themeParams.button_color;
  if (!c) return;
  let [r, g, b] = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, e = mx - mn;
  if (e) { s = l > .5 ? e / (2 - mx - mn) : e / (mx + mn); h = 60 * (mx === r ? (g - b) / e + (g < b ? 6 : 0) : mx === g ? (b - r) / e + 2 : (r - g) / e + 4); }
  document.body.style.setProperty('--b', 'hsl(' + ((h + 40) % 360) + ',' + Math.round(s * 100) + '%,' + Math.round(l * 85) + '%)');
}
function load(t) { try { const n = JSON.parse(t); if (n && (S.r === undefined || n.r >= S.r)) S = n; } catch (e) {} }
function el(t, c, txt) { const e = document.createElement(t); if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; }
function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function count(to) {
  const from = shown, t0 = Date.now();
  (function f() {
    const k = Math.min(1, (Date.now() - t0) / 600);
    shown = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    $('pc').textContent = shown + '%';
    if (k < 1) requestAnimationFrame(f);
  })();
}
function confetti(box) {
  const C = ['#ffd23f', '#ff5e7e', '#2fb563', '#7cc7ff', '#b07cff'];
  for (let i = 0; i < 14; i++) {
    const p = el('i', 'cf'), k = i / 14 * 6.28;
    p.style.cssText = 'background:' + C[i % 5] + ';--x:' + Math.round(Math.cos(k) * (60 + i * 5)) + 'px;--y:' + Math.round(Math.sin(k) * 40 - 20) + 'px;animation-delay:' + (i % 4) * 40 + 'ms';
    box.append(p);
  }
}
function sub() {
  const f = S.f || [], n = f.length + (S.x || 0), ok = f.filter((i) => i[1] === 4).length + (S.xo || 0);
  $('sub').textContent = ok + ' из ' + n + (S.t0 ? ' · ' + mmss((S.t1 || Date.now() / 1000) - S.t0) : '') + (S.to ? ' → ' + S.to : '');
}
function draw() {
  const f = S.f || [], n = f.length + (S.x || 0), fin = !!S.t1;
  const ok = f.filter((i) => i[1] === 4).length + (S.xo || 0), bad = f.filter((i) => i[1] === 5).length + (S.xe || 0);
  const pts = f.reduce((a, i) => a + Math.min(i[1], 4), 0) + ((S.xo || 0) + (S.xe || 0)) * 4;
  const pct = n ? Math.round((fin ? ok * 4 : pts) / (n * 4) * 100) : 0;
  $('w').className = fin && !bad ? 'dn' : '';
  $('fg').setAttribute('stroke-dashoffset', String(Math.round(145 * (1 - pct / 100))));
  if (pct !== shown) count(pct);
  sub();
  let ix = f.map((i, k) => k);
  if (fin) ix.sort((a, b) => f[b][1] - f[a][1]);
  else { const a = f.findIndex((i) => i[1] < 4), st = Math.max(0, Math.min((a < 0 ? f.length : a) - 1, f.length - 5)); ix = ix.slice(st); }
  ix = ix.slice(0, 5);
  const more = n - ix.length;
  $('list').replaceChildren(...ix.map((k) => {
    const i = f[k], s = i[1], run = s > 0 && s < 4, nw = prev && prev[k] !== s && s > 3;
    const r = el('div', 'it s' + s + (run ? ' run' : '') + (nw ? ' nw' : '')), b = el('div', 'b'), ic = el('div', 'ic', s === 5 ? '!' : '');
    if (s === 4) ic.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7.5l3 3 7-7"/></svg>';
    b.append(el('div', 'nm', i[0]));
    if (s === 5) b.append(el('div', 'er', i[2] || PH[5]));
    else {
      b.append(el('div', 'h', PH[s]));
      if (run) { const p = el('div', 'ph'); for (let j = 1; j < 4; j++) p.append(el('i', j < s ? 'y' : j === s ? 'c' : '')); b.append(p); }
    }
    r.append(ic, b); return r;
  }));
  if (more) $('list').append(el('div', 'h', '…и ещё ' + more));
  prev = f.map((i) => i[1]);
  const e = $('end');
  const k2 = fin + ':' + busy + ':' + bad;
  if (k2 === key) return;
  key = k2;
  e.replaceChildren();
  if (fin) {
    const c = el('div', 'end', bad ? '⚠️ Не отправлено: ' + bad + '. Проверьте формат и настройки Amazon.' : '🎉 Готово! Книги появятся в библиотеке Kindle через пару минут.');
    e.append(c);
    if (fin0 === false) {
      W && W.HapticFeedback.notificationOccurred(bad ? 'warning' : 'success');
      if (!bad) confetti(c);
    }
    if (bad) {
      const b = el('button', '', '↻ Повторить неудачные'); b.disabled = !!busy;
      b.onclick = () => {
        if (!W) return;
        busy = 1; $('m').textContent = 'Отправляю…'; draw();
        W.request('pr:retry:' + S.id).then((a) => { busy = 0; $('m').textContent = ''; load(a.result); draw(); },
          (er) => { busy = 0; $('m').textContent = ERR[er.code] || 'Ошибка: ' + er.code; draw(); });
      };
      e.append(b);
    }
  }
  fin0 = fin;
}
if (W) { load(W.chatData); tone(); W.onEvent('chatDataChanged', () => { load(W.chatData); draw(); }); W.onEvent('themeChanged', tone); }
draw();
setInterval(sub, 1000);
if (W) W.ready();
</script>
